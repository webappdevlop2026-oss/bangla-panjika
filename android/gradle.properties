org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Kotlin-এর incremental compiler Windows-এ "Storage ... is already registered"
# ভুল দিচ্ছিল (shared_preferences_android কম্পাইল করার সময়)। প্রতিবার পুরোটা
# কম্পাইল করলে সমস্যাটা হয় না — বিল্ড সামান্য ধীর হবে, কিন্তু নির্ভরযোগ্য।
kotlin.incremental=false
# কম্পাইলার আলাদা প্রসেসে চালানো হয়, যাতে ক্যাশ ফাইল আটকে না থাকে
kotlin.compiler.execution.strategy=out-of-process
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
