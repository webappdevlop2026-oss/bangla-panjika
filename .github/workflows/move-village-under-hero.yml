name: Move Village Under Hero

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/move-village-under-hero.yml'

permissions:
  contents: write

jobs:
  move-village:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Move village scene directly below hero date card
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/main.dart')
          text = path.read_text(encoding='utf-8')

          desktop_anchor = """      children: [
        _HeroDateCard(),
        const SizedBox(height: 14),
        const _HistoryBanner(),
"""
          desktop_new = """      children: [
        _HeroDateCard(),
        const SizedBox(height: 14),
        ClipRRect(
          borderRadius: BorderRadius.circular(20),
          child: const VillageHorizonScene(height: 300),
        ),
        const SizedBox(height: 14),
        const _HistoryBanner(),
"""

          mobile_anchor = """              const SizedBox(height: 16),
              _HeroDateCard(),
              const SizedBox(height: 12),
              const _HistoryBanner(),
"""
          mobile_new = """              const SizedBox(height: 16),
              _HeroDateCard(),
              const SizedBox(height: 12),
              ClipRRect(
                borderRadius: BorderRadius.circular(20),
                child: const VillageHorizonScene(),
              ),
              const SizedBox(height: 12),
              const _HistoryBanner(),
"""

          desktop_old = """        const SizedBox(height: 20),
        const _SectionTitle('জীবন্ত বাংলা গ্রাম • LIVE'),
        const SizedBox(height: 10),
        ClipRRect(
          borderRadius: BorderRadius.circular(20),
          child: const VillageHorizonScene(height: 300),
        ),
        const SizedBox(height: 14),
        const AdBannerWidget(),
"""
          desktop_old_new = """        const SizedBox(height: 14),
        const AdBannerWidget(),
"""

          mobile_old = """              const SizedBox(height: 20),
              const _SectionTitle('জীবন্ত বাংলা গ্রাম • LIVE'),
              const SizedBox(height: 10),
              ClipRRect(
                borderRadius: BorderRadius.circular(20),
                child: const VillageHorizonScene(),
              ),
              const SizedBox(height: 14),
              const AdBannerWidget(),
"""
          mobile_old_new = """              const SizedBox(height: 14),
              const AdBannerWidget(),
"""

          for name, old in [
              ('desktop hero anchor', desktop_anchor),
              ('mobile hero anchor', mobile_anchor),
              ('desktop old village block', desktop_old),
              ('mobile old village block', mobile_old),
          ]:
              if old not in text:
                  raise SystemExit(f'Missing expected block: {name}')

          text = text.replace(desktop_anchor, desktop_new, 1)
          text = text.replace(mobile_anchor, mobile_new, 1)
          text = text.replace(desktop_old, desktop_old_new, 1)
          text = text.replace(mobile_old, mobile_old_new, 1)
          path.write_text(text, encoding='utf-8')

      - name: Validate and commit
        run: |
          git diff --check
          if git diff --quiet -- lib/main.dart; then
            echo "No main.dart change produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          git commit -m "Move live village directly below home date card"
          git push
