name: Apply Easy Calendar

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-easy-calendar.yml'
      - 'APPLY_EASY_CALENDAR.ps1'

permissions:
  contents: write

jobs:
  apply-easy-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Easy Calendar patch
        shell: pwsh
        run: ./APPLY_EASY_CALENDAR.ps1

      - name: Validate Dart syntax
        uses: dart-lang/setup-dart@v1
      - run: dart format --output=none lib/main.dart lib/easy_calendar_screen.dart

      - name: Commit main.dart change
        run: |
          git diff --check
          if git diff --quiet -- lib/main.dart; then
            echo "Expected main.dart change was not produced."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          git commit -m "Move Easy Calendar to standalone button"
          git push
