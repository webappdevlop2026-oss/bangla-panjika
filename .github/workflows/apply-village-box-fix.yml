name: Apply Village Box Fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-village-box-fix.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply safe village box fix
        shell: pwsh
        run: ./APPLY_VILLAGE_BOX_FIX.ps1

      - name: Remove local backup artifact
        run: rm -f lib/main.dart.village_box_backup

      - name: Validate and commit only main.dart
        run: |
          git diff --check
          if git diff --quiet -- lib/main.dart; then
            echo "Expected main.dart change was not produced."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          git commit -m "Hide auspicious purchase days from village scene"
          git push
